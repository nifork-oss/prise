<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прайс-лист работ и услуг</title>
    <!-- Подключаем библиотеку для генерации PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
        h1, h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        .nav-btn { display: flex; justify-content: center; align-items: center; text-decoration: none; background: #007bff; color: white; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,123,255,0.3); }
        .action-main-btn { background: #28a745; margin-bottom: 15px; border: none; cursor: pointer; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        .category-header { background: #e9ecef; font-weight: bold; padding: 12px; border-radius: 6px; margin: 20px 0 10px 0; font-size: 16px; color: #495057; display: flex; justify-content: space-between; align-items: center; }
        .service-card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .service-info { flex: 1; padding-right: 10px; }
        .service-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: #222; }
        .service-price { color: #28a745; font-weight: bold; font-size: 16px; white-space: nowrap; }
        .admin-controls { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .admin-controls h3 { margin-top: 0; font-size: 16px; color: #856404; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; font-weight: 500; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; width: 100%; text-align: center; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-sm { padding: 4px 8px; font-size: 11px; width: auto; margin-left: 5px; }
        .action-row { display: flex; gap: 5px; }
        .loader { text-align: center; color: #007bff; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="calc.html" class="nav-btn">🔐 Вход для мастеров (Калькулятор и История)</a>
    <button type="button" class="action-main-btn" onclick="generatePricePDF()">📄 Скачать прайс-лист в PDF</button>

    <h1>📋 Прайс-лист работ и услуг</h1>

    <!-- Панель управления для администратора -->
    <div id="adminPanel" class="admin-controls">
        <h3>⚙️ Режим редактирования (Админ)</h3>
        <div class="form-group">
            <label>Название услуги или категории</label>
            <input type="text" id="newName" placeholder="Например: Укладка плитки">
        </div>
        <div class="form-group">
            <label>Цена (оставьте пустым, если это категория)</label>
            <input type="number" id="newPrice" placeholder="Например: 1000">
        </div>
        <button type="button" class="btn btn-success" onclick="addServiceItem()">➕ Добавить в прайс</button>
    </div>

    <div id="loader" class="loader">⏳ Загрузка прайса из облака...</div>
    <div id="priceListContainer"></div>
</div>
<script>
    const BIN_ID = "6a98820eda38895dfe310361";
    const MASTER_KEY = "$2a$10$V5zoj8HIhi0GtDS/ZY5EXe0m1yUvWzV8enXWJjCCaeREOkxKbEvyC";

    let cloudData = { services: [], users: [{ login: "admin", pass: "12345" }], history: [] };

    window.addEventListener('DOMContentLoaded', () => {
        loadCloudData();
        checkAdminAccess();
    });

    async function loadCloudData() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            const data = await res.json();
            if (data.record) {
                cloudData = data.record;
            }
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
            renderPriceList();
        } catch (e) {
            console.error(e);
            const loader = document.getElementById('loader');
            if (loader) loader.innerText = 'Ошибка загрузки данных.';
        }
    }

    async function saveCloudData() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify(cloudData)
            });
        } catch (e) {
            console.error(e);
            alert("Ошибка сохранения в облако!");
        }
    }

    function checkAdminAccess() {
        const isAdmin = localStorage.getItem('isAdminAuthorized') === 'true';
        if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'block';
        }
    }

    function renderPriceList() {
        const container = document.getElementById('priceListContainer');
        if (!container) return;
        container.innerHTML = '';
        const services = cloudData.services || [];

        if (services.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#888;">Прайс-лист пока пуст</div>';
            return;
        }

        const isAdmin = localStorage.getItem('isAdminAuthorized') === 'true';

        services.forEach((srv, idx) => {
            if (srv.isCategory) {
                const cat = document.createElement('div');
                cat.className = 'category-header';
                let adminBtns = isAdmin ? `
                    <div class="action-row">
                        <button type="button" class="btn btn-danger btn-sm" onclick="deleteServiceItem(${idx})">Удалить</button>
                    </div>
                ` : '';
                cat.innerHTML = `<span>📂 ${srv.name}</span>${adminBtns}`;
                container.appendChild(cat);
            } else {
                const card = document.createElement('div');
                card.className = 'service-card';
                let adminBtns = isAdmin ? `
                    <div class="action-row" style="margin-left: 10px;">
                        <button type="button" class="btn btn-danger btn-sm" onclick="deleteServiceItem(${idx})">✕</button>
                    </div>
                ` : '';
                card.innerHTML = `
                    <div class="service-info">
                        <div class="service-title">${srv.name}</div>
                        <div class="service-price">${Number(srv.price).toLocaleString('ru-RU')} ₽</div>
                    </div>
                    ${adminBtns}
                `;
                container.appendChild(card);
            }
        });
    }

    function generatePricePDF() {
        const services = cloudData.services || [];
        if (services.length === 0) {
            alert("Прайс-лист пуст!");
            return;
        }

        const element = document.createElement('div');
        element.style.padding = '20px';
        element.style.background = '#ffffff';
        element.style.fontFamily = 'Arial, sans-serif';
        element.style.color = '#333';

        let htmlContent = `
            <h2 style="color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top:0; text-align:center;">ПРАЙС-ЛИСТ УСЛУГ</h2>
            <p style="text-align:center; font-size: 12px; color: #666;">Актуально на: ${new Date().toLocaleDateString('ru-RU')}</p>
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        `;

        services.forEach(srv => {
            if (srv.isCategory) {
                htmlContent += `
                    <tr>
                        <td colspan="2" style="background-color: #e9ecef; font-weight: bold; padding: 10px; border: 1px solid #ddd; font-size: 15px; color: #333;">
                            ${srv.name}
                        </td>
                    </tr>
                `;
            } else {
                htmlContent += `
                    <tr>
                        <td style="border: 1px solid #ddd; padding: 8px; font-size: 14px;">${srv.name}</td>
                        <td style="border: 1px solid #ddd; padding: 8px; font-size: 14px; text-align: right; font-weight: bold; color: #28a745; width: 120px;">${Number(srv.price).toLocaleString('ru-RU')} ₽</td>
                    </tr>
                `;
            }
        });

        htmlContent += `</table>`;
        element.innerHTML = htmlContent;

        const opt = {
            margin:       10,
            filename:     'Prais_list_uslug.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save();
    }

    async function addServiceItem() {
        const name = document.getElementById('newName').value.trim();
        const priceVal = document.getElementById('newPrice').value.trim();

        if (!name) {
            alert('Введите название!');
            return;
        }

        const isCategory = priceVal === '';
        const price = isCategory ? 0 : Number(priceVal);

        if (!cloudData.services) cloudData.services = [];
        cloudData.services.push({ name, price, isCategory });

        await saveCloudData();
        document.getElementById('newName').value = '';
        document.getElementById('newPrice').value = '';
        renderPriceList();
        alert('Успешно добавлено в прайс!');
    }

    async function deleteServiceItem(idx) {
        if (!confirm("Удалить этот пункт из прайса?")) return;
        cloudData.services.splice(idx, 1);
        await saveCloudData();
        renderPriceList();
    }
</script>

</body>
</html>
