<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        h2 { font-size: 18px; margin-top: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        .nav-btn { display: flex; justify-content: center; align-items: center; text-decoration: none; background: #007bff; color: white; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .category-header { background: #e9ecef; font-weight: bold; padding: 10px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 16px; color: #495057; }
        .service-card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .service-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .service-price { color: #28a745; font-weight: bold; }
        .unit-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .unit-row input[type="number"] { width: 110px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
        .unit-row select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: white; flex: 1; }
        .add-to-cart-btn { background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 10px; font-weight: 600; width: 100%; }
        .total-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: right; font-size: 20px; font-weight: bold; }
        .invoice-preview { background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .invoice-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .btn-delete-item { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
        .action-btns { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; text-align: center; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .loader { text-align: center; color: #007bff; font-weight: bold; padding: 20px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 600px; max-height: 90vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px; background: #f8f9fa; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        .pdf-offscreen { position: absolute; left: -9999px; top: 0; width: 700px; background: #fff; padding: 30px; font-family: Arial; color: #333; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ddd; padding: 8px; font-size: 13px; text-align: left; }
        .pdf-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Калькулятор услуг</h1>
    <a href="price.html" class="nav-btn">📋 Прайс-лист услуг</a>

    <div class="form-group">
        <label>ФИО Заказчика</label>
        <input type="text" id="clientName" placeholder="Иванов И.И." oninput="updateInvoiceInfo()">
    </div>
    <div class="form-group">
        <label>Адрес объекта</label>
        <input type="text" id="objectAddress" placeholder="г. Москва" oninput="updateInvoiceInfo()">
    </div>

    <h2>🛠 Выберите услуги:</h2>
    <div id="loader" class="loader">⏳ Загрузка прайса...</div>
    <div id="servicesList"></div>

    <h2>🧾 Предпросмотр счета</h2>
    <div class="invoice-preview">
        <div id="invoiceInfo" style="margin-bottom: 10px; font-size: 13px; color: #555;"></div>
        <div id="invoiceItems"></div>
        <div class="total-box">Итого: <span id="totalSum">0</span> ₽</div>
    </div>

    <div class="action-btns">
        <button class="btn btn-primary" onclick="openPdfPreview()">👁 Предпросмотр счета (PDF)</button>
        <button class="btn btn-danger" onclick="resetAll()">❌ Очистить всё</button>
    </div>
</div>

<div class="modal-overlay" id="pdfModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>👁 Предпросмотр документа</h3>
            <button onclick="closePdfPreview()" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
        </div>
        <div class="modal-body" id="pdfPreviewContainer"></div>
        <div class="modal-footer">
            <button class="btn btn-success" onclick="sharePDFInvoice()">📤 Поделиться / Скачать PDF</button>
            <button class="btn btn-danger" onclick="closePdfPreview()" style="width: 120px;">Закрыть</button>
        </div>
    </div>
</div>

<div id="pdfInvoice" class="pdf-offscreen">
    <div style="border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px;">
        <div style="font-size: 20px; font-weight: bold; color: #007bff;">СЧЕТ НА ОПЛАТУ УСЛУГ</div>
        <div id="pdfDate" style="font-size: 12px; color: #777; margin-top: 4px;"></div>
    </div>
    <div id="pdfClientDetails" style="font-size: 13px; margin-bottom: 15px;"></div>
    <table class="pdf-table">
        <thead><tr><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Цена</th><th>Сумма</th></tr></thead>
        <tbody id="pdfTableBody"></tbody>
    </table>
    <div style="text-align: right; margin-top: 15px; font-size: 16px; font-weight: bold;">
        ИТОГО К ОПЛАТЕ: <span id="pdfTotalSum"></span> ₽
    </div>
</div>

<script src="app.js"></script>
<script>loadCloudData(false);</script>
</body>
</html>
