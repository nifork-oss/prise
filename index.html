<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг</title>
    <!-- Подключаем библиотеку html2pdf.js для генерации PDF документов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        h2 { font-size: 18px; margin-top: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        
        .nav-btn { display: flex; justify-content: center; align-items: center; text-decoration: none; background: #007bff; color: white; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; text-align: center; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .category-header { background: #e9ecef; font-weight: bold; padding: 10px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 16px; color: #495057; }

        .service-card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .service-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .service-price { color: #28a745; font-weight: bold; white-space: nowrap; }
        
        .unit-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .unit-row input[type="number"] { width: 100px; padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .unit-row select { padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; flex: 1; }
        .remove-unit-btn { background: #dc3545; color: white; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .add-variant-btn { background: #28a745; color: white; border: none; padding: 10px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 10px; font-weight: 600; width: 100%; text-align: center; }

        .total-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: right; font-size: 20px; font-weight: bold; }

        .invoice-preview { background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .invoice-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .invoice-item-info { display: flex; align-items: center; gap: 8px; }
        .btn-delete-item { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }

        .action-btns { margin-top: 15px; }
        
        .btn { padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }

        .loader { text-align: center; color: #007bff; font-weight: bold; padding: 20px; }

        #pdfInvoice { display: none; }
        .pdf-template { padding: 30px; font-family: Arial, sans-serif; color: #333; background: #fff; }
        .pdf-header { display: flex; justify-content: space-between; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .pdf-title { font-size: 20px; font-weight: bold; color: #007bff; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
        .pdf-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Калькулятор услуг</h1>

    <a href="price.html" class="nav-btn">📋 Прайс-лист услуг</a>

    <div class="form-group">
        <label>ФИО Заказчика</label>
        <input type="text" id="clientName" placeholder="Иванов Иван Иванович" oninput="updateInvoice()">
    </div>
    <div class="form-group">
        <label>Адрес объекта</label>
        <input type="text" id="objectAddress" placeholder="г. Москва, ул. Ленина, д. 1" oninput="updateInvoice()">
    </div>

    <h2>🛠 Выберите услуги:</h2>
    <div id="loader" class="loader">⏳ Загрузка актуального прайс-листа...</div>
    <div id="servicesList"></div>

    <h2>🧾 Предпросмотр счета</h2>
    <div class="invoice-preview">
        <div id="invoiceInfo" style="margin-bottom: 10px; font-size: 13px; color: #555;"></div>
        <div id="invoiceItems"></div>
        <div class="total-box">Итого: <span id="totalSum">0</span> ₽</div>
    </div>

    <div class="action-btns">
        <button class="btn btn-primary" onclick="sharePDFInvoice()">📤 Отправить счет в PDF</button>
        <button class="btn btn-danger" onclick="resetAll()" style="margin-top: 10px;">❌ Очистить всё</button>
    </div>
</div>

<div id="pdfInvoice" class="pdf-template">
    <div class="pdf-header">
        <div>
            <div class="pdf-title">СЧЕТ НА ОПЛАТУ УСЛУГ</div>
            <div id="pdfDate" style="font-size: 12px; color: #777;"></div>
        </div>
    </div>
    <div id="pdfClientDetails" style="font-size: 13px; margin-bottom: 15px;"></div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>Наименование работы / услуги</th>
                <th>Кол-во</th>
                <th>Ед. изм.</th>
                <th>Цена</th>
                <th>Сумма</th>
            </tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
    </table>
    <div style="text-align: right; margin-top: 15px; font-size: 16px; font-weight: bold;">
        ИТОГО К ОПЛАТЕ: <span id="pdfTotalSum"></span> ₽
    </div>
</div>

<script>
    const BIN_ID = "6a98820eda38895dfe310361";
    const MASTER_KEY = "$2a$10$V5zoj8HIhi0GtDS/ZY5EXe0m1yUvWzV8enXWJjCCaeREOkxKbEvyC";

    const DEFAULT_UNITS = ['м²', 'пог. м', 'шт.', 'компл.', 'час', 'усл.'];

    let services = [];
    let selectedVariants = {}; 

    async function loadServicesFromCloud() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            const data = await res.json();
            
            if (data.record && data.record.services) {
                services = data.record.services;
            } else if (Array.isArray(data.record)) {
                services = data.record;
            }

            document.getElementById('loader').style.display = 'none';
            renderServices();
        } catch (e) {
            document.getElementById('loader').innerText = "Ошибка загрузки прайса.";
        }
    }

    function renderServices() {
        const container = document.getElementById('servicesList');
        container.innerHTML = '';

        if (!services || services.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#888;">Прайс-лист пуст. Добавьте услуги в разделе прайса.</div>';
            return;
        }

        services.forEach((srv, idx) => {
            if (srv.isCategory) {
                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerText = srv.name;
                container.appendChild(catHeader);
            } else {
                if (!selectedVariants[idx]) {
                    selectedVariants[idx] = [];
                }

                const card = document.createElement('div');
                card.className = 'service-card';
                card.id = `card_${idx}`;
                
                card.innerHTML = `
                    <div class="service-title">
                        <span>${srv.name}</span>
                        <span class="service-price">${Number(srv.price).toLocaleString('ru-RU')} ₽</span>
                    </div>
                    <div id="unitsContainer_${idx}"></div>
                    <button class="add-variant-btn" onclick="addVariant(${idx})">➕ Добавить услугу в счёт</button>
                `;
                container.appendChild(card);
                renderUnitRows(idx);
            }
        });

        updateInvoice();
    }

    function renderUnitRows(srvIdx) {
        const container = document.getElementById(`unitsContainer_${srvIdx}`);
        if (!container) return;
        container.innerHTML = '';

        selectedVariants[srvIdx].forEach((varItem, varIdx) => {
            const row = document.createElement('div');
            row.className = 'unit-row';

            let optionsHTML = DEFAULT_UNITS.map(u => `<option value="${u}" ${varItem.unit === u ? 'selected' : ''}>${u}</option>`).join('');

            row.innerHTML = `
                <input type="number" min="0" placeholder="Кол-во" value="${varItem.qty}" oninput="updateQty(${srvIdx}, ${varIdx}, this.value)">
                <select onchange="updateUnit(${srvIdx}, ${varIdx}, this.value)">
                    ${optionsHTML}
                </select>
                <button class="remove-unit-btn" onclick="removeVariant(${srvIdx}, ${varIdx})" title="Удалить из счёта">✕</button>
            `;
            container.appendChild(row);
        });
    }

    function addVariant(srvIdx) {
        selectedVariants[srvIdx].push({ qty: '1', unit: DEFAULT_UNITS[0] });
        renderUnitRows(srvIdx);
        updateInvoice();
    }

    function removeVariant(srvIdx, varIdx) {
        selectedVariants[srvIdx].splice(varIdx, 1);
        renderUnitRows(srvIdx);
        updateInvoice();
    }

    function updateQty(srvIdx, varIdx, val) {
        selectedVariants[srvIdx][varIdx].qty = val;
        updateInvoice();
    }

    function updateUnit(srvIdx, varIdx, val) {
        selectedVariants[srvIdx][varIdx].unit = val;
        updateInvoice();
    }

    function updateInvoice() {
        const invoiceItems = document.getElementById('invoiceItems');
        const invoiceInfo = document.getElementById('invoiceInfo');
        const clientName = document.getElementById('clientName').value.trim();
        const objectAddress = document.getElementById('objectAddress').value.trim();

        invoiceItems.innerHTML = '';
        let total = 0;
        let hasItems = false;

        let infoHTML = '';
        if (clientName) infoHTML += `<b>Заказчик:</b> ${clientName}<br>`;
        if (objectAddress) infoHTML += `<b>Адрес:</b> ${objectAddress}`;
        invoiceInfo.innerHTML = infoHTML;

        services.forEach((srv, idx) => {
            if (srv.isCategory || !selectedVariants[idx]) return;

            selectedVariants[idx].forEach((v, varIdx) => {
                const qty = parseFloat(v.qty);
                if (qty > 0) {
                    hasItems = true;
                    const itemSum = qty * Number(srv.price);
                    total += itemSum;

                    const itemRow = document.createElement('div');
                    itemRow.className = 'invoice-item';
                    itemRow.innerHTML = `
                        <div class="invoice-item-info">
                            <button class="btn-delete-item" onclick="removeVariant(${idx}, ${varIdx})" title="Удалить позицию">✕</button>
                            <span>${srv.name} (${qty} ${v.unit})</span>
                        </div>
                        <div><b>${itemSum.toLocaleString('ru-RU')} ₽</b></div>
                    `;
                    invoiceItems.appendChild(itemRow);
                }
            });
        });

        if (!hasItems) {
            invoiceItems.innerHTML = '<div style="color:#888; font-size: 13px; text-align:center;">Нажмите «➕ Добавить услугу в счёт» напротив нужной работы</div>';
        }

        document.getElementById('totalSum').textContent = total.toLocaleString('ru-RU');
    }

    function resetAll() {
        document.getElementById('clientName').value = '';
        document.getElementById('objectAddress').value = '';
        selectedVariants = {};
        renderServices();
    }

    async function sharePDFInvoice() {
        const clientName = document.getElementById('clientName').value.trim();
        const objectAddress = document.getElementById('objectAddress').value.trim();
        const pdfTableBody = document.getElementById('pdfTableBody');
        
        pdfTableBody.innerHTML = '';
        let total = 0;
        let hasItems = false;

        services.forEach((srv, idx) => {
            if (srv.isCategory || !selectedVariants[idx]) return;

            selectedVariants[idx].forEach((v) => {
                const qty = parseFloat(v.qty);
                if (qty > 0) {
                    hasItems = true;
                    const itemSum = qty * Number(srv.price);
                    total += itemSum;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${srv.name}</td>
                        <td>${qty}</td>
                        <td>${v.unit}</td>
                        <td>${Number(srv.price).toLocaleString('ru-RU')} ₽</td>
                        <td>${itemSum.toLocaleString('ru-RU')} ₽</td>
                    `;
                    pdfTableBody.appendChild(tr);
                }
            });
        });

        if (!hasItems) {
            alert("Добавьте хотя бы одну услугу в счёт!");
            return;
        }

        document.getElementById('pdfDate').innerText = `Дата: ${new Date().toLocaleDateString('ru-RU')}`;
        document.getElementById('pdfClientDetails').innerHTML = `
            ${clientName ? `<b>Заказчик:</b> ${clientName}<br>` : ''}
            ${objectAddress ? `<b>Адрес объекта:</b> ${objectAddress}` : ''}
        `;
        document.getElementById('pdfTotalSum').innerText = total.toLocaleString('ru-RU');

        const element = document.getElementById('pdfInvoice');
        element.style.display = 'block';

        const opt = {
            margin:       10,
            filename:     'Счет_на_оплату.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
        element.style.display = 'none';

        const file = new File([pdfBlob], 'Счет_на_оплату.pdf', { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Счет на оплату',
                    text: 'Направляю счет на оплату в формате PDF.'
                });
            } catch (err) {}
        } else {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(pdfBlob);
            link.download = 'Счет_на_оплату.pdf';
            link.click();
        }
    }

    loadServicesFromCloud();
</script>

</body>
</html>
