<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прайс-лист услуг</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a1a1a; font-size: 22px; margin-top: 0; margin-bottom: 15px; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 9px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; text-align: center; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-sm { padding: 5px 8px; font-size: 12px; }

        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .admin-panel { background: #eef7ff; border: 1px solid #bce0fd; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        
        .category-card { background: #e9ecef; border-radius: 6px; padding: 10px 12px; margin: 18px 0 8px 0; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #495057; font-size: 15px; }
        .category-actions { display: flex; gap: 4px; }

        .service-card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .service-info { flex: 1; margin-right: 10px; }
        .service-name { font-size: 14px; font-weight: 500; color: #222; }
        .service-price { font-weight: bold; color: #28a745; font-size: 14px; white-space: nowrap; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal { background:#fff; padding:20px; border-radius:10px; max-width:400px; width:90%; }
        .modal h3 { margin-top:0; font-size:18px; }
        .modal input, .modal select { width:100%; padding:9px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
        .loader { text-align: center; padding: 20px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="calc.html" class="btn btn-primary">🧮 Перейти в калькулятор</a>
        <button type="button" id="toggleAdminBtn" class="btn btn-warning" onclick="toggleEditMode()">✏️ Режим редактирования</button>
    </div>

    <h1>📋 Прайс-лист услуг</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Поиск услуги..." oninput="renderServices()">
    </div>

    <!-- Панель управления администратора -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <span style="font-size:13px; font-weight:bold; color:#0056b3;">🛠 Режим редактирования</span>
        <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-success btn-sm" onclick="openAddCategoryModal()">➕ Категория</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddServiceModal()">➕ Услуга</button>
        </div>
    </div>

    <div id="loader" class="loader">⏳ Загрузка прайса из облака...</div>
    <div id="servicesContainer"></div>
</div>

<!-- Модальное окно: Категория -->
<div id="categoryModal" class="modal-overlay">
    <div class="modal">
        <h3 id="categoryModalTitle">Добавить категорию</h3>
        <input type="hidden" id="editCatIndex">
        <input type="text" id="catNameInput" placeholder="Название категории">
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeModal('categoryModal')">Отмена</button>
            <button type="button" class="btn btn-success" style="flex:1;" onclick="saveCategory()">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модальное окно: Услуга -->
<div id="serviceModal" class="modal-overlay">
    <div class="modal">
        <h3 id="serviceModalTitle">Добавить услугу</h3>
        <input type="hidden" id="editSrvIndex">
        <input type="text" id="srvNameInput" placeholder="Наименование услуги">
        <input type="number" id="srvPriceInput" placeholder="Цена в ₽">
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeModal('serviceModal')">Отмена</button>
            <button type="button" class="btn btn-success" style="flex:1;" onclick="saveService()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "6a98820eda38895dfe310361";
    let cloudData = { services: [] };
    let isEditMode = false;

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await loadCloudData();
        checkAuth();
    });

    function checkAuth() {
        const currentUser = localStorage.getItem('currentUser');
        const userRole = localStorage.getItem('userRole');
        if (currentUser && userRole === 'admin') {
            document.getElementById('toggleAdminBtn').style.display = 'inline-flex';
        } else {
            document.getElementById('toggleAdminBtn').style.display = 'none';
            isEditMode = false;
        }
    }

    async function loadCloudData() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
            const data = await res.json();
            
            // Загружаем ровно то, что лежит в баке
            if (data.record) {
                if (Array.isArray(data.record.services)) {
                    cloudData.services = data.record.services;
                } else if (Array.isArray(data.record)) {
                    cloudData.services = data.record;
                }
            }
        } catch (e) {
            console.error("Ошибка при получении данных:", e);
            document.getElementById('loader').innerText = "❌ Ошибка загрузки из JSONBin";
            return;
        } finally {
            document.getElementById('loader').style.display = 'none';
            renderServices();
        }
    }

    async function saveCloudData() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(cloudData)
            });
        } catch (e) {
            console.error("Ошибка сохранения:", e);
        }
    }

    function toggleEditMode() {
        isEditMode = !isEditMode;
        document.getElementById('adminPanel').style.display = isEditMode ? 'flex' : 'none';
        document.getElementById('toggleAdminBtn').textContent = isEditMode ? '👁 Режим просмотра' : '✏️ Режим редактирования';
        renderServices();
    }

    function renderServices() {
        const container = document.getElementById('servicesContainer');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        container.innerHTML = '';

        if (!cloudData.services || cloudData.services.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Прайс-лист пуст в базе JSONBin</div>';
            return;
        }

        cloudData.services.forEach((srv, idx) => {
            if (query && !srv.isCategory && !srv.name.toLowerCase().includes(query)) {
                return;
            }

            if (srv.isCategory) {
                const catEl = document.createElement('div');
                catEl.className = 'category-card';
                catEl.innerHTML = `
                    <span class="category-title">${escapeHtml(srv.name)}</span>
                    ${isEditMode ? `
                        <div class="category-actions">
                            <button type="button" class="btn btn-warning btn-sm" onclick="openEditCategoryModal(${idx})" title="Переименовать категорию">✏️</button>
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteItem(${idx})" title="Удалить категорию">🗑</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(catEl);
            } else {
                const srvEl = document.createElement('div');
                srvEl.className = 'service-card';
                srvEl.innerHTML = `
                    <div class="service-info">
                        <div class="service-name">${escapeHtml(srv.name)}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="service-price">${Number(srv.price).toLocaleString('ru-RU')} ₽</span>
                        ${isEditMode ? `
                            <button type="button" class="btn btn-warning btn-sm" onclick="openEditServiceModal(${idx})" title="Редактировать услугу">✏️</button>
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteItem(${idx})" title="Удалить услугу">🗑</button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(srvEl);
            }
        });
    }

    // --- Категории ---
    function openAddCategoryModal() {
        document.getElementById('categoryModalTitle').textContent = "➕ Добавить категорию";
        document.getElementById('editCatIndex').value = "";
        document.getElementById('catNameInput').value = "";
        document.getElementById('categoryModal').style.display = 'flex';
    }

    function openEditCategoryModal(idx) {
        document.getElementById('categoryModalTitle').textContent = "✏️ Редактировать категорию";
        document.getElementById('editCatIndex').value = idx;
        document.getElementById('catNameInput').value = cloudData.services[idx].name;
        document.getElementById('categoryModal').style.display = 'flex';
    }

    async function saveCategory() {
        const name = document.getElementById('catNameInput').value.trim();
        const editIdx = document.getElementById('editCatIndex').value;

        if (!name) {
            alert("Введите название категории!");
            return;
        }

        if (editIdx !== "") {
            cloudData.services[editIdx].name = name;
        } else {
            cloudData.services.push({ name, isCategory: true });
        }

        closeModal('categoryModal');
        renderServices();
        await saveCloudData();
    }

    // --- Услуги ---
    function openAddServiceModal() {
        document.getElementById('serviceModalTitle').textContent = "➕ Добавить услугу";
        document.getElementById('editSrvIndex').value = "";
        document.getElementById('srvNameInput').value = "";
        document.getElementById('srvPriceInput').value = "";
        document.getElementById('serviceModal').style.display = 'flex';
    }

    function openEditServiceModal(idx) {
        document.getElementById('serviceModalTitle').textContent = "✏️ Редактировать услугу";
        document.getElementById('editSrvIndex').value = idx;
        document.getElementById('srvNameInput').value = cloudData.services[idx].name;
        document.getElementById('srvPriceInput').value = cloudData.services[idx].price;
        document.getElementById('serviceModal').style.display = 'flex';
    }

    async function saveService() {
        const name = document.getElementById('srvNameInput').value.trim();
        const price = parseFloat(document.getElementById('srvPriceInput').value);
        const editIdx = document.getElementById('editSrvIndex').value;

        if (!name || isNaN(price)) {
            alert("Укажите наименование и цену!");
            return;
        }

        if (editIdx !== "") {
            cloudData.services[editIdx].name = name;
            cloudData.services[editIdx].price = price;
        } else {
            cloudData.services.push({ name, price, isCategory: false });
        }

        closeModal('serviceModal');
        renderServices();
        await saveCloudData();
    }

    // --- Общие функции ---
    async function deleteItem(idx) {
        const item = cloudData.services[idx];
        const typeStr = item.isCategory ? "категорию" : "услугу";
        
        if (!confirm(`Вы действительно хотите удалить ${typeStr} "${item.name}"?`)) return;

        cloudData.services.splice(idx, 1);
        renderServices();
        await saveCloudData();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }
</script>

</body>
</html>
