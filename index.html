<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прайс-лист услуг</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; margin: 0; padding: 12px 8px; color: #1e293b; }

        .container { max-width: 680px; margin: 0 auto; background: #ffffff; padding: 20px 16px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .brand { font-size: 18px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
        .brand-badge { background: #4f46e5; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        .nav-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: #0f172a; color: #ffffff; padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; transition: background 0.2s; border: none; min-height: 40px; }
        .nav-btn:hover { background: #334155; }

        .hero { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(49, 46, 129, 0.12); }
        .hero h1 { font-size: 20px; margin: 0 0 6px 0; font-weight: 700; color: #ffffff; }
        .hero p { margin: 0; font-size: 13px; color: #c7d2fe; opacity: 0.9; }

        .search-box { margin-bottom: 20px; position: relative; }
        .search-box input { width: 100%; padding: 12px 14px 12px 38px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none; background: #ffffff; transition: border-color 0.2s; }
        .search-box input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 15px; pointer-events: none; }

        /* Стиль группы и выпадающей категории */
        .category-group { margin-bottom: 12px; }
        .category-header { 
            background: #f8fafc; 
            font-weight: 700; 
            padding: 12px 14px; 
            border-radius: 10px; 
            margin: 12px 0 8px 0; 
            font-size: 14px; 
            color: #334155; 
            border-left: 4px solid #6366f1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
            border-top: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }
        .category-header:hover { background: #f1f5f9; }
        .category-title { display: flex; align-items: center; gap: 8px; flex: 1; }
        .category-arrow { font-size: 11px; color: #6366f1; transition: transform 0.2s ease; display: inline-block; }
        .category-count { font-size: 11px; color: #64748b; background: #e2e8f0; padding: 2px 7px; border-radius: 12px; font-weight: 600; }

        .category-group.collapsed .category-arrow { transform: rotate(-90deg); }
        .category-group.collapsed .category-items { display: none; }

        .service-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: border-color 0.2s; }
        .service-card:hover { border-color: #cbd5e1; }
        .service-name { font-weight: 600; font-size: 14px; color: #0f172a; word-break: break-word; }
        .service-price { color: #059669; font-weight: 700; font-size: 15px; white-space: nowrap; }

        /* Панель администратора */
        .admin-panel { background: #f5f3ff; border: 1px solid #c7d2fe; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .admin-title { font-size: 14px; font-weight: 700; color: #4338ca; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; background: #fff; -webkit-appearance: none; }

        .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-success { background: #10b981; color: white; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-danger { background: #f43f5e; color: white; }
        .btn-sm { padding: 5px 8px; font-size: 11px; min-height: 30px; border-radius: 6px; }

        .admin-actions { display: flex; gap: 4px; align-items: center; }

        .loader { text-align: center; color: #4f46e5; font-weight: 600; padding: 24px; font-size: 14px; }
        .empty-state { text-align: center; color: #94a3b8; padding: 30px 10px; font-size: 14px; }

        @media (min-width: 481px) {
            body { padding: 20px 15px; }
            .container { padding: 28px; }
            .hero h1 { font-size: 22px; }
            .search-box input, .form-group input, .form-group select { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="brand">
            📋 Прайс-лист
            <span class="brand-badge">2026</span>
        </div>
        <a href="calc.html" class="nav-btn">🔑 Кабинет мастера / Расчет</a>
    </div>

    <div class="hero">
        <h1>Каталог услуг и стоимость</h1>
        <p>Нажмите на категорию, чтобы открыть список работ</p>
    </div>

    <!-- Режим Администратора -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <div class="admin-title">
            <span>⚙️ Режим редактирования прайса</span>
            <span style="font-size: 11px; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px;">ADMIN</span>
        </div>
        
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
            <button type="button" class="btn btn-primary" onclick="showAddModal('category')" style="flex:1;">➕ Категорию</button>
            <button type="button" class="btn btn-success" onclick="showAddModal('service')" style="flex:1;">➕ Услугу</button>
        </div>

        <!-- Форма добавления -->
        <div id="addForm" style="display: none; background: #ffffff; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; margin-bottom: 12px;">
            <h4 id="formTitle" style="margin: 0 0 10px 0; font-size: 13px; color: #0f172a;">Добавление</h4>
            
            <div class="form-group" id="categorySelectGroup">
                <label>Выберите категорию</label>
                <select id="targetCategorySelect"></select>
            </div>

            <div class="form-group">
                <label id="itemNameLabel">Название</label>
                <input type="text" id="itemName" placeholder="Наименование...">
            </div>

            <div class="form-group" id="priceGroup">
                <label>Цена (₽)</label>
                <input type="number" id="itemPrice" placeholder="1000">
            </div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button type="button" class="btn btn-success" onclick="saveNewItem()" style="flex: 1;">Сохранить</button>
                <button type="button" class="btn btn-danger" onclick="hideAddForm()" style="flex: 1;">Отмена</button>
            </div>
        </div>

        <button type="button" class="btn btn-primary" onclick="saveToCloud()" style="width: 100%;">💾 Сохранить изменения на сервер</button>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск услуги по названию..." oninput="filterServices()">
    </div>

    <div id="loader" class="loader">⏳ Загрузка актуального прайс-листа...</div>
    <div id="servicesContainer"></div>
</div>

<script>
    const BIN_ID = "6a98820eda38895dfe310361";
    const MASTER_KEY = "$2a$10$V5zoj8HIhi0GtDS/ZY5EXe0m1yUvWzV8enXWJjCCaeREOkxKbEvyC";

    let cloudData = { services: [], users: [], history: [] };
    let isAdmin = false;
    let currentAddType = 'service';
    let collapsedCategories = new Set(); // Хранит индексы свёрнутых категорий

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', async () => {
        checkAdminStatus();
        await loadCloudData();
    });

    function checkAdminStatus() {
        isAdmin = localStorage.getItem('isAdminAuthorized') === 'true';
        if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'block';
        }
    }

    async function loadCloudData() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            const data = await res.json();
            if (data.record && Array.isArray(data.record.services)) {
                cloudData = data.record;
            }
        } catch (e) {
            console.error("Ошибка загрузки:", e);
        } finally {
            document.getElementById('loader').style.display = 'none';
            renderServices();
        }
    }

    async function saveToCloud() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                body: JSON.stringify(cloudData)
            });
            alert("Прайс-лист успешно обновлен!");
        } catch (e) {
            alert("Ошибка сохранения: " + e.message);
        }
    }

    function toggleCategory(catIdx) {
        if (collapsedCategories.has(catIdx)) {
            collapsedCategories.delete(catIdx);
        } else {
            collapsedCategories.add(catIdx);
        }
        renderServices(document.getElementById('searchInput').value);
    }

    function renderServices(filterQuery = "") {
        const container = document.getElementById('servicesContainer');
        container.innerHTML = '';

        const query = filterQuery.toLowerCase().trim();
        const services = cloudData.services || [];

        if (services.length === 0) {
            container.innerHTML = '<div class="empty-state">Прайс-лист пока пуст</div>';
            return;
        }

        // Группируем услуги по категориям
        let currentGroupEl = null;
        let currentItemsEl = null;
        let totalMatches = 0;

        services.forEach((item, idx) => {
            if (item.isCategory) {
                // Подсчет количества услуг в этой категории
                let serviceCount = 0;
                for (let i = idx + 1; i < services.length && !services[i].isCategory; i++) {
                    if (!query || services[i].name.toLowerCase().includes(query)) {
                        serviceCount++;
                    }
                }

                // Если при поиске в категории нет совпадений — пропускаем заголовок
                if (query && serviceCount === 0) {
                    currentGroupEl = null;
                    return;
                }

                const isCollapsed = !query && collapsedCategories.has(idx);

                currentGroupEl = document.createElement('div');
                currentGroupEl.className = `category-group ${isCollapsed ? 'collapsed' : ''}`;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.onclick = () => toggleCategory(idx);

                header.innerHTML = `
                    <div class="category-title">
                        <span class="category-arrow">▼</span>
                        <span>${escapeHtml(item.name)}</span>
                        <span class="category-count">${serviceCount}</span>
                    </div>
                    ${isAdmin ? `
                        <div class="admin-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-success btn-sm" onclick="showAddModal('service', ${idx})">➕ Услуга</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteItem(${idx})">🗑</button>
                            <button class="btn btn-sm" style="background:#e2e8f0;" onclick="moveItem(${idx}, -1)">▲</button>
                            <button class="btn btn-sm" style="background:#e2e8f0;" onclick="moveItem(${idx}, 1)">▼</button>
                        </div>
                    ` : ''}
                `;

                currentItemsEl = document.createElement('div');
                currentItemsEl.className = 'category-items';

                currentGroupEl.appendChild(header);
                currentGroupEl.appendChild(currentItemsEl);
                container.appendChild(currentGroupEl);
            } else {
                // Услуга
                if (!query || item.name.toLowerCase().includes(query)) {
                    totalMatches++;
                    const card = document.createElement('div');
                    card.className = 'service-card';
                    card.innerHTML = `
                        <div class="service-name">${escapeHtml(item.name)}</div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="service-price">${Number(item.price).toLocaleString('ru-RU')} ₽</div>
                            ${isAdmin ? `
                                <div class="admin-actions">
                                    <button class="btn btn-primary btn-sm" onclick="editItem(${idx})">✏️</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteItem(${idx})">🗑</button>
                                    <button class="btn btn-sm" style="background:#e2e8f0;" onclick="moveItem(${idx}, -1)">▲</button>
                                    <button class="btn btn-sm" style="background:#e2e8f0;" onclick="moveItem(${idx}, 1)">▼</button>
                                </div>
                            ` : ''}
                        </div>
                    `;

                    if (currentItemsEl) {
                        currentItemsEl.appendChild(card);
                    } else {
                        // Если услуга без категории
                        container.appendChild(card);
                    }
                }
            }
        });

        if (query && totalMatches === 0) {
            container.innerHTML = '<div class="empty-state">Ничего не найдено по вашему запросу</div>';
        }
    }

    function filterServices() {
        const q = document.getElementById('searchInput').value;
        renderServices(q);
    }

    /* Админ-функции */
    function showAddModal(type, targetCatIdx = null) {
        currentAddType = type;
        const form = document.getElementById('addForm');
        form.style.display = 'block';

        const catSelectGroup = document.getElementById('categorySelectGroup');
        const priceGroup = document.getElementById('priceGroup');
        const select = document.getElementById('targetCategorySelect');

        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';

        if (type === 'category') {
            document.getElementById('formTitle').textContent = '➕ Добавление новой категории';
            document.getElementById('itemNameLabel').textContent = 'Название категории';
            catSelectGroup.style.display = 'none';
            priceGroup.style.display = 'none';
        } else {
            document.getElementById('formTitle').textContent = '➕ Добавление новой услуги';
            document.getElementById('itemNameLabel').textContent = 'Название услуги';
            catSelectGroup.style.display = 'block';
            priceGroup.style.display = 'block';

            select.innerHTML = '<option value="-1">Без категории (в самый конец)</option>';
            cloudData.services.forEach((item, idx) => {
                if (item.isCategory) {
                    const selected = (targetCatIdx !== null && targetCatIdx === idx) ? 'selected' : '';
                    select.innerHTML += `<option value="${idx}" ${selected}>📂 ${escapeHtml(item.name)}</option>`;
                }
            });
        }
    }

    function hideAddForm() {
        document.getElementById('addForm').style.display = 'none';
    }

    function saveNewItem() {
        const name = document.getElementById('itemName').value.trim();
        if (!name) {
            alert("Введите название!");
            return;
        }

        if (currentAddType === 'category') {
            cloudData.services.push({ isCategory: true, name });
        } else {
            const price = parseFloat(document.getElementById('itemPrice').value);
            if (isNaN(price) || price < 0) {
                alert("Укажите корректную цену!");
                return;
            }

            const catIdx = parseInt(document.getElementById('targetCategorySelect').value);
            const newItem = { name, price };

            if (catIdx === -1) {
                cloudData.services.push(newItem);
            } else {
                let insertIdx = catIdx + 1;
                while (insertIdx < cloudData.services.length && !cloudData.services[insertIdx].isCategory) {
                    insertIdx++;
                }
                cloudData.services.splice(insertIdx, 0, newItem);
                // При добавлении распахнем категорию
                collapsedCategories.delete(catIdx);
            }
        }

        hideAddForm();
        renderServices();
    }

    function editItem(idx) {
        const item = cloudData.services[idx];
        const newName = prompt("Новое название:", item.name);
        if (newName === null) return;

        const newPrice = prompt("Новая цена (₽):", item.price);
        if (newPrice === null) return;

        if (newName.trim() !== '') item.name = newName.trim();
        if (!isNaN(parseFloat(newPrice))) item.price = parseFloat(newPrice);

        renderServices();
    }

    function deleteItem(idx) {
        if (!confirm(`Удалить "${cloudData.services[idx].name}"?`)) return;
        cloudData.services.splice(idx, 1);
        renderServices();
    }

    function moveItem(idx, direction) {
        const newIndex = idx + direction;
        if (newIndex < 0 || newIndex >= cloudData.services.length) return;
        
        const temp = cloudData.services[idx];
        cloudData.services[idx] = cloudData.services[newIndex];
        cloudData.services[newIndex] = temp;
        
        renderServices();
    }
</script>

</body>
</html>
