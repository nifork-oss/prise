<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг и счетов</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        h2 { font-size: 18px; margin-top: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        
        .nav-btn { display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; background: #007bff; color: white; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .nav-btn:hover { background: #0056b3; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .category-header { background: #e9ecef; font-weight: bold; padding: 10px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 16px; color: #495057; }

        .service-card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .service-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .service-price { color: #28a745; font-weight: bold; white-space: nowrap; }
        .service-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .service-controls input[type="number"] { width: 90px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .total-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: right; font-size: 20px; font-weight: bold; }

        .invoice-preview { background: #f8f9fa; border: 2px dashed #007bff; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .invoice-item { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #e0e0e0; }
        .invoice-item:last-child { border-bottom: none; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }

        .empty-msg { text-align: center; color: #888; font-size: 14px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Калькулятор работ и услуг</h1>

    <a href="price.html" class="nav-btn">⚙️ Управление прайс-листом</a>

    <div class="form-group">
        <label>ФИО Заказчика</label>
        <input type="text" id="clientName" placeholder="Иванов Иван Иванович" oninput="updateInvoice()">
    </div>
    <div class="form-group">
        <label>Адрес объекта</label>
        <input type="text" id="objectAddress" placeholder="г. Москва, ул. Ленина, д. 1" oninput="updateInvoice()">
    </div>

    <h2>🛠 Выберите услуги:</h2>
    <div id="servicesList"></div>
    <div id="emptyServicesMsg" class="empty-msg" style="display:none;">Прайс-лист пуст. Перейдите в настройки прайса для добавления услуг.</div>

    <h2>🧾 Предпросмотр счета</h2>
    <div class="invoice-preview" id="invoiceArea">
        <div id="invoiceInfo" style="margin-bottom: 10px; font-size: 13px; color: #555;"></div>
        <div id="invoiceItems"></div>
        <div class="total-box">Итого: <span id="totalSum">0</span> ₽</div>
    </div>

    <div class="action-btns">
        <button class="btn btn-danger" onclick="resetAll()">❌ Очистить всё</button>
        <button class="btn btn-success" onclick="window.print()">🖨 Печать / PDF</button>
    </div>
</div>

<script>
    // Исходный полная структура с категориями
    const defaultServices = [
        { isCategory: true, name: "Подготовительные работы" },
        { name: "Монтаж фасадной сетки", price: 500, unit: "м²" },
        { name: "Армирование стен фасадной сеткой", price: 450, unit: "м²" },
        { name: "Монтаж стеклохолста", price: 500, unit: "м²" },
        { name: "Наклейка стеклохолста на шпатлевку", price: 400, unit: "м²" },
        { name: "Нанесение грунт-краски", price: 200, unit: "м²" },
        { name: "Грунт-краска вместо клея", price: 250, unit: "м²" },
        { name: "Шпатлевание и грунтовка", price: 500, unit: "м²" },
        { name: "Финишное шпатлевание", price: 500, unit: "м²" },
        { name: "Финишное выравнивание", price: 500, unit: "м²" },
        
        { isCategory: true, name: "Покрасочные работы" },
        { name: "Нанесение праймера", price: 300, unit: "м²" },
        { name: "Грунтовка перед покраской", price: 200, unit: "м²" },
        { name: "Покраска стен в 2 слоя", price: 500, unit: "м²" },
        { name: "Покраска лепнины", price: 500, unit: "м.п." },
        { name: "Покраска плинтуса и молдингов", price: 400, unit: "м.п." },

        { isCategory: true, name: "Монтажные работы" },
        { name: "Монтаж карниза", price: 500, unit: "м.п." },
        { name: "Установка потолочных карнизов", price: 600, unit: "м.п." },
        { name: "Монтаж молдинга", price: 500, unit: "м.п." },
        { name: "Установка декоративных молдингов", price: 550, unit: "м.п." }
    ];

    function getServices() {
        const stored = localStorage.getItem('my_price_list');
        if (!stored) {
            localStorage.setItem('my_price_list', JSON.stringify(defaultServices));
            return defaultServices;
        }
        return JSON.parse(stored);
    }

    function renderServices() {
        const services = getServices();
        const container = document.getElementById('servicesList');
        const emptyMsg = document.getElementById('emptyServicesMsg');

        container.innerHTML = '';

        if (services.length === 0) {
            emptyMsg.style.display = 'block';
            updateInvoice();
            return;
        }
        emptyMsg.style.display = 'none';

        services.forEach((srv, idx) => {
            if (srv.isCategory) {
                // Вывод заголовка категории
                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerText = srv.name;
                container.appendChild(catHeader);
            } else {
                // Вывод отдельной услуги
                const card = document.createElement('div');
                card.className = 'service-card';
                const unitText = srv.unit ? ` / ${srv.unit}` : '';
                card.innerHTML = `
                    <div class="service-title">
                        <span>${srv.name}</span>
                        <span class="service-price">${Number(srv.price).toLocaleString('ru-RU')} ₽${unitText}</span>
                    </div>
                    <div class="service-controls">
                        <input type="number" min="0" placeholder="Кол-во" id="qty_${idx}" oninput="updateInvoice()">
                        <span style="font-size: 13px; color: #666;">${srv.unit || 'шт.'}</span>
                    </div>
                `;
                container.appendChild(card);
            }
        });

        updateInvoice();
    }

    function updateInvoice() {
        const services = getServices();
        const invoiceItems = document.getElementById('invoiceItems');
        const invoiceInfo = document.getElementById('invoiceInfo');
        const clientName = document.getElementById('clientName').value.trim();
        const objectAddress = document.getElementById('objectAddress').value.trim();

        invoiceItems.innerHTML = '';
        let total = 0;
        let hasItems = false;

        let infoHTML = '';
        if (clientName) infoHTML += `<b>Заказчик:</b> ${clientName}<br>`;
        if (objectAddress) infoHTML += `<b>Адрес:</b> ${objectAddress}`;
        invoiceInfo.innerHTML = infoHTML;

        services.forEach((srv, idx) => {
            if (srv.isCategory) return; // категории пропускаем при расчете

            const qtyInput = document.getElementById(`qty_${idx}`);
            const qty = qtyInput ? parseFloat(qtyInput.value) : 0;

            if (qty > 0) {
                hasItems = true;
                const itemSum = qty * Number(srv.price);
                total += itemSum;

                const itemRow = document.createElement('div');
                itemRow.className = 'invoice-item';
                itemRow.innerHTML = `
                    <span>${srv.name} (${qty} ${srv.unit || 'шт.'})</span>
                    <b>${itemSum.toLocaleString('ru-RU')} ₽</b>
                `;
                invoiceItems.appendChild(itemRow);
            }
        });

        if (!hasItems) {
            invoiceItems.innerHTML = '<div style="color:#888; font-size: 13px; text-align:center;">Укажите количество хотя бы для одной услуги</div>';
        }

        document.getElementById('totalSum').textContent = total.toLocaleString('ru-RU');
    }

    function resetAll() {
        document.getElementById('clientName').value = '';
        document.getElementById('objectAddress').value = '';
        const inputs = document.querySelectorAll('#servicesList input[type="number"]');
        inputs.forEach(input => input.value = '');
        updateInvoice();
    }

    renderServices();
</script>

</body>
</html>
