<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление прайс-листом</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        
        .nav-btn { display: inline-block; text-decoration: none; background: #6c757d; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-bottom: 15px; }

        .auth-box { text-align: center; padding: 20px 0; }
        .auth-box input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 200px; text-align: center; }

        .form-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .service-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .category-item { background: #e9ecef; font-weight: bold; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; width: 100%; }
        .btn-success { background: #28a745; color: white; width: 100%; margin-top: 10px; }
        .btn-danger { background: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }

        .hint { font-size: 11px; color: #888; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-btn">⬅ Назад к калькулятору</a>
    <h1>🔒 Управление прайс-листом</h1>

    <!-- Ввод PIN-кода -->
    <div id="authBox" class="auth-box">
        <p>Введите PIN-код для доступа:</p>
        <input type="password" id="pinInput" placeholder="****" maxlength="4">
        <button class="btn btn-primary" style="margin-top: 10px;" onclick="checkPin()">Войти</button>
    </div>

    <!-- Панель управления (скрыта по умолчанию) -->
    <div id="adminPanel" style="display: none;">
        
        <div class="form-box">
            <h3 style="margin-top:0;">➕ Добавить позицию</h3>
            <div class="form-group">
                <label>Тип</label>
                <select id="typeSelect" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;" onchange="toggleFormType()">
                    <option value="service">Услуга / Работа</option>
                    <option value="category">Раздел / Категория</option>
                </select>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="nameInput" placeholder="Например: Поклейка обоев">
            </div>
            <div id="serviceFields">
                <div class="form-group">
                    <label>Единицы измерения (через слэш /)</label>
                    <input type="text" id="unitInput" placeholder="например: м² / пог. м">
                    <div class="hint">Укажите варианты разделяя слэшем '/', чтобы при расчете можно было выбрать любой.</div>
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="priceInput" placeholder="350">
                </div>
            </div>
            <button class="btn btn-primary" onclick="addItem()">Добавить в прайс</button>
        </div>

        <h2>Текущий прайс-лист:</h2>
        <div id="priceList"></div>

        <button class="btn btn-success" onclick="saveToCloud()">💾 Сохранить изменения в облако</button>
    </div>
</div>

<script>
    const BIN_ID = "6a98820eda38895dfe310361";
    const MASTER_KEY = "$2a$10$V5zoj8HIhi0GtDS/ZY5EXe0m1yUvWzV8enXWJjCCaeREOkxKbEvyC";
    const CORRECT_PIN = "1234";

    let services = [];

    function checkPin() {
        const pin = document.getElementById('pinInput').value;
        if (pin === CORRECT_PIN) {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        } else {
            alert('Неверный PIN-код!');
        }
    }

    async function loadData() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            const data = await res.json();
            
            if (data.record && data.record.services) {
                services = data.record.services;
            } else if (Array.isArray(data.record)) {
                services = data.record;
            }
            renderList();
        } catch (e) {
            alert("Ошибка загрузки прайса.");
        }
    }

    function toggleFormType() {
        const type = document.getElementById('typeSelect').value;
        document.getElementById('serviceFields').style.display = type === 'service' ? 'block' : 'none';
    }

    function renderList() {
        const list = document.getElementById('priceList');
        list.innerHTML = '';

        services.forEach((item, index) => {
            const div = document.createElement('div');
            if (item.isCategory) {
                div.className = 'service-item category-item';
                div.innerHTML = `<span>📁 <b>${item.name}</b></span>
                                 <button class="btn btn-danger" onclick="deleteItem(${index})">✕</button>`;
            } else {
                div.className = 'service-item';
                div.innerHTML = `<span>${item.name} — <b>${Number(item.price).toLocaleString('ru-RU')} ₽</b> [${item.unit || 'шт.'}]</span>
                                 <button class="btn btn-danger" onclick="deleteItem(${index})">✕</button>`;
            }
            list.appendChild(div);
        });
    }

    function addItem() {
        const type = document.getElementById('typeSelect').value;
        const name = document.getElementById('nameInput').value.trim();

        if (!name) {
            alert('Введите название!');
            return;
        }

        if (type === 'category') {
            services.push({ name: name, isCategory: true });
        } else {
            const unit = document.getElementById('unitInput').value.trim() || 'шт.';
            const price = parseFloat(document.getElementById('priceInput').value);

            if (isNaN(price)) {
                alert('Укажите корректную цену!');
                return;
            }

            services.push({ name: name, unit: unit, price: price, isCategory: false });
        }

        document.getElementById('nameInput').value = '';
        document.getElementById('unitInput').value = '';
        document.getElementById('priceInput').value = '';

        renderList();
    }

    function deleteItem(index) {
        if (confirm('Удалить эту позицию?')) {
            services.splice(index, 1);
            renderList();
        }
    }

    async function saveToCloud() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify({ services: services })
            });

            if (res.ok) {
                alert("Прайс-лист успешно обновлен в облаке!");
            } else {
                alert("Ошибка сохранения.");
            }
        } catch (e) {
            alert("Ошибка сети при сохранении.");
        }
    }
</script>

</body>
</html>
