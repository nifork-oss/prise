<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление прайс-листом</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; text-align: center; color: #1a1a1a; font-size: 24px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { flex: 1; min-width: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        button.add-btn { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #eee; background: #fafafa; margin-bottom: 8px; border-radius: 8px; }
        .item-info { display: flex; justify-content: space-between; width: 100%; margin-right: 15px; font-size: 16px; }
        .item-name { font-weight: 500; }
        .item-price { font-weight: bold; color: #28a745; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .empty-msg { text-align: center; color: #888; margin: 20px 0; }
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Управление прайс-листом</h1>

    <div class="form-group">
        <input type="text" id="itemName" placeholder="Название услуги/товара">
        <input type="number" id="itemPrice" placeholder="Цена (руб.)">
        <button class="add-btn" onclick="addItem()">Добавить</button>
    </div>

    <ul id="priceList"></ul>
    <div id="emptyMsg" class="empty-msg" style="display: none;">Список пуст</div>

    <a href="index.html" class="nav-link">← Вернуться к калькулятору</a>
</div>

<script>
    const defaultItems = [
        { name: "Консультация", rawPrice: 1000, price: "1 000" },
        { name: "Базовая настройка", rawPrice: 2500, price: "2 500" },
        { name: "Полный комплекс", rawPrice: 5000, price: "5 000" }
    ];

    function getStoredItems() {
        const stored = localStorage.getItem('my_price_list');
        if (!stored) {
            localStorage.setItem('my_price_list', JSON.stringify(defaultItems));
            return defaultItems;
        }
        return JSON.parse(stored);
    }

    let items = getStoredItems();

    function renderList() {
        const listContainer = document.getElementById('priceList');
        const emptyMsg = document.getElementById('emptyMsg');
        listContainer.innerHTML = '';

        if (items.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        } else {
            emptyMsg.style.display = 'none';
        }

        items.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">${item.price} ₽</span>
                </div>
                <button class="delete-btn" onclick="deleteItem(${index})">Удалить</button>
            `;
            listContainer.appendChild(li);
        });
    }

    function addItem() {
        const nameInput = document.getElementById('itemName');
        const priceInput = document.getElementById('itemPrice');

        const name = nameInput.value.trim();
        const rawPrice = Number(priceInput.value.trim());

        if (!name || isNaN(rawPrice) || rawPrice <= 0) {
            alert('Введите корректное название и цену!');
            return;
        }

        items.push({ 
            name: name, 
            rawPrice: rawPrice,
            price: rawPrice.toLocaleString('ru-RU') 
        });

        localStorage.setItem('my_price_list', JSON.stringify(items));

        nameInput.value = '';
        priceInput.value = '';
        renderList();
    }

    function deleteItem(index) {
        items.splice(index, 1);
        localStorage.setItem('my_price_list', JSON.stringify(items));
        renderList();
    }

    renderList();
</script>

</body>
</html>
